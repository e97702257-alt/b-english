    const state = {
      role: null,
      selectedLesson: 1,
      teacherTab: 'study',
      
      roomPin: '2026',
      groupName: 'ЭК-401',
      disciplineName: 'Деловой иностранный язык',
      assessmentType: 'Практическое занятие (текущий контроль)',
      teacherFullName: 'Смирнова А.В.',
      lessonDate: new Date().toLocaleDateString('ru-RU'),
      
      studentName: '',
      studentId: '',
      isJoined: false,
      isSubmitted: false,
      studentAnswers: { vocab: {}, grammar: {}, test: {} },
      
      studentsList: []
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get('room')) state.roomPin = params.get('room');
    if (params.get('group')) state.groupName = params.get('group');
    if (params.get('role') === 'student') state.role = 'student';

    function initFirebaseListener() {
      if (state.role === 'teacher') {
        const roomRef = database.ref(`rooms/${state.roomPin}/students`);
        roomRef.on('value', (snapshot) => {
          const data = snapshot.val();
          state.studentsList = data ? Object.values(data) : [];
          render();
        });
      }
    }

    function calculateMetrics(answers) {
      const totalVocab = LESSON_DATA.vocabTasks.length;
      let vocabCorrect = 0;
      LESSON_DATA.vocabTasks.forEach(task => {
        if (answers.vocab[task.id] === task.correct) vocabCorrect++;
      });
      const vocabPercent = Math.round((vocabCorrect / totalVocab) * 100);

      const totalGrammar = LESSON_DATA.grammarTasks.length;
      let grammarCorrect = 0;
      LESSON_DATA.grammarTasks.forEach(task => {
        if (answers.grammar[task.id] === task.correct) grammarCorrect++;
      });
      const grammarPercent = Math.round((grammarCorrect / totalGrammar) * 100);

      const totalAvailable = totalVocab + totalGrammar + LESSON_DATA.testQuestions.length;
      const totalAnswered = Object.keys(answers.vocab).length + Object.keys(answers.grammar).length + Object.keys(answers.test).length;
      const activityPercent = Math.round((totalAnswered / totalAvailable) * 100);

      const totalTest = LESSON_DATA.testQuestions.length;
      let testCorrect = 0;
      LESSON_DATA.testQuestions.forEach(task => {
        if (answers.test[task.id] === task.correct) testCorrect++;
      });
      const testPercent = Math.round((testCorrect / totalTest) * 100);

      const compositeScore = Math.round(
        (testPercent * 0.40) + 
        (vocabPercent * 0.25) + 
        (grammarPercent * 0.25) + 
        (activityPercent * 0.10)
      );

      // Шкала: 95-100% (5), 66-94% (4), 51-65% (3), 1-50% (2)
      let grade = 2;
      let gradeText = "2 (Неуд)";
      if (compositeScore >= 95) { grade = 5; gradeText = "5 (Отл)"; }
      else if (compositeScore >= 66) { grade = 4; gradeText = "4 (Хор)"; }
      else if (compositeScore >= 51) { grade = 3; gradeText = "3 (Удовл)"; }

      return {
        vocabPercent,
        grammarPercent,
        activityPercent,
        testPercent,
        testCorrect,
        totalTest,
        compositeScore,
        grade,
        gradeText
      };
    }

    window.setRole = function(r) {
      state.role = r;
      if (r === 'teacher') initFirebaseListener();
      render();
    };

    window.setTeacherTab = function(tab) {
      state.teacherTab = tab;
      render();
    };

    window.updateTeacherMeta = function(field, val) {

    };

    window.joinClass = function(e) {
      e.preventDefault();
      const nameInput = document.getElementById('student-name-input');
      if (!nameInput || !nameInput.value.trim()) return alert("Введите ваши Фамилию и Имя!");
      
      state.studentName = nameInput.value.trim();
      state.studentId = 'std_' + Math.random().toString(36).substr(2, 9);
      state.isJoined = true;

      const metrics = calculateMetrics(state.studentAnswers);
      const studentPayload = {
        id: state.studentId,
        name: state.studentName,
        group: state.groupName,
        ...metrics,
        lastActive: new Date().toLocaleTimeString()
      };

      database.ref(`rooms/${state.roomPin}/students/${state.studentId}`).set(studentPayload);
      render();
    };

    window.selectAnswerByIndex = function(category, taskId, optionIndex) {
      let list = [];
      if (category === 'vocab') list = LESSON_DATA.vocabTasks;
      else if (category === 'grammar') list = LESSON_DATA.grammarTasks;
      else if (category === 'test') list = LESSON_DATA.testQuestions;

      const item = list.find(x => x.id === taskId);
      if (!item) return;

      const chosenOption = item.options[optionIndex];
      state.studentAnswers[category][taskId] = chosenOption;
      
      const metrics = calculateMetrics(state.studentAnswers);
      const studentPayload = {
        id: state.studentId,
        name: state.studentName,
        group: state.groupName,
        ...metrics,
        lastActive: new Date().toLocaleTimeString()
      };

      database.ref(`rooms/${state.roomPin}/students/${state.studentId}`).update(studentPayload);
      render();
    };

      pdfContainer.innerHTML = `

              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-size: 9.5pt;">Грамматика (%)</th>
              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-size: 9.5pt;">Активность (%)</th>
              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-size: 9.5pt;">Тест (%)</th>

          </div>
        </div>
      `;

      document.body.appendChild(pdfContainer);

      const opt = {
        margin: [10, 10, 10, 10],
        filename: `Ведомость_${state.groupName}_Урок1.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        document.body.removeChild(pdfContainer);
      }).catch(err => {
        console.error(err);
        document.body.removeChild(pdfContainer);
      });
    };

                    <div class="text-xs">
                      <p class="font-semibold text-slate-800 mb-2">${idx + 1}. ${t.q}</p>
                      <div class="grid grid-cols-2 gap-2">
                        ${t.options.map((opt, optIdx) => `
                          <button
                            onclick="selectAnswerByIndex('grammar', '${t.id}', ${optIdx})"
                            class="py-2 px-1 rounded-lg font-bold border text-center transition ${
                              state.studentAnswers.grammar[t.id] === opt 
                                ? 'bg-purple-600 text-white border-purple-600 shadow-sm' 
                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                            }"
                          >
                            ${opt}
                          </button>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </section>

              <!-- Тест 30 вопросов -->
              <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                <h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                  <span class="w-5 h-5 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xs">3</span>
                  Итоговый тест (30 вопросов)
                </h3>
                <div class="space-y-4">
                  ${LESSON_DATA.testQuestions.map((t) => `
                    <div class="text-xs border-b border-slate-100 pb-3">
                      <p class="font-semibold text-slate-800 mb-2">${t.q}</p>
                      <div class="grid grid-cols-3 gap-2">
                        ${t.options.map((opt, optIdx) => `
                          <button
                            onclick="selectAnswerByIndex('test', '${t.id}', ${optIdx})"
                            class="py-2 px-1 rounded-lg font-bold border text-center transition ${
                              state.studentAnswers.test[t.id] === opt 
                                ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                            }"
                          >
                            ${opt}
                          </button>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </section>

              <button
                onclick="submitLesson()"
                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-600/30 text-xs sm:text-sm uppercase tracking-wider transition"
              >
                Завершить тест и получить оценку
              </button>

            </main>
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
