    function App() {
      const [role, setRole] = useState(null); // 'teacher' | 'student'
      const [selectedLesson, setSelectedLesson] = useState(1);
      const [teacherTab, setTeacherTab] = useState('study'); // 'study' | 'quiz'
      const [studentTab, setStudentTab] = useState('study'); // 'study' | 'quiz'

      // Поля метаданных преподавателя
      const [roomPin, setRoomPin] = useState('2026');
      const [groupName, setGroupName] = useState('ЭК-401');
      const [disciplineName, setDisciplineName] = useState('Деловой иностранный язык');
      const [assessmentType, setAssessmentType] = useState('Практическое занятие (текущий контроль)');
      const [teacherFullName, setTeacherFullName] = useState('Смирнова А.В.');
      const [lessonDate, setLessonDate] = useState(new Date().toLocaleDateString('ru-RU'));

      // Поля студента
      const [studentName, setStudentName] = useState('');
      const [studentId, setStudentId] = useState('');
      const [isJoined, setIsJoined] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [studentAnswers, setStudentAnswers] = useState({ vocab: {}, grammar: {}, test: {} });

      const [studentsList, setStudentsList] = useState([]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRole = params.get('role');
        const urlRoom = params.get('room');
        const urlGroup = params.get('group');
        const urlMode = params.get('mode');

        if (urlRoom) setRoomPin(urlRoom);
        if (urlGroup) setGroupName(urlGroup);
        if (urlMode) setStudentTab(urlMode);
        if (urlRole === 'student') setRole('student');
      }, []);

      useEffect(() => {
        if (role === 'teacher') {
          const roomRef = database.ref(`rooms/${roomPin}/students`);
          roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              setStudentsList(Object.values(data));
            } else {
              setStudentsList([]);
            }
          });
          return () => roomRef.off();
        }
      }, [role, roomPin]);

      const handleDeleteStudent = (stId, stName) => {
        if (window.confirm(`Удалить студента «${stName}» из ведомости?`)) {
          database.ref(`rooms/${roomPin}/students/${stId}`).remove();
        }
      };

      const handleClearAllStudents = () => {
        if (window.confirm(`Очистить весь список группы ${groupName}?`)) {
          database.ref(`rooms/${roomPin}/students`).remove();
        }
      };

      // --- ТОЧНЫЙ РАСЧЕТ ОЦЕНОК ПО НОВОЙ ШКАЛЕ ---
      const calculateMetrics = (answers) => {
        const totalVocab = LESSON_1_DATA.vocabTasks.length;
        let vocabCorrect = 0;
        LESSON_1_DATA.vocabTasks.forEach(task => {
          if (answers.vocab[task.id] === task.correct) vocabCorrect++;
        });
        const vocabPercent = Math.round((vocabCorrect / totalVocab) * 100);

        const totalGrammar = LESSON_1_DATA.grammarTasks.length;
        let grammarCorrect = 0;
        LESSON_1_DATA.grammarTasks.forEach(task => {
          if (answers.grammar[task.id] === task.correct) grammarCorrect++;
        });
        const grammarPercent = Math.round((grammarCorrect / totalGrammar) * 100);

        const totalAvailable = totalVocab + totalGrammar + LESSON_1_DATA.testQuestions.length;
        const totalAnswered = Object.keys(answers.vocab).length + Object.keys(answers.grammar).length + Object.keys(answers.test).length;
        const activityPercent = Math.round((totalAnswered / totalAvailable) * 100);

        const totalTest = LESSON_1_DATA.testQuestions.length;
        let testCorrect = 0;
        LESSON_1_DATA.testQuestions.forEach(task => {
          if (answers.test[task.id] === task.correct) testCorrect++;
        });
        const testPercent = Math.round((testCorrect / totalTest) * 100);

        const compositeScore = Math.round(
          (testPercent * 0.40) + 
          (vocabPercent * 0.25) + 
          (grammarPercent * 0.25) + 
          (activityPercent * 0.10)
        );

        // Шкала: 1-50% = 2, 51-65% = 3, 66-94% = 4, 95-100% = 5
        let grade = 2;
        let gradeText = "2 (Неуд)";
        if (compositeScore >= 95) { grade = 5; gradeText = "5 (Отл)"; }
        else if (compositeScore >= 66) { grade = 4; gradeText = "4 (Хор)"; }
        else if (compositeScore >= 51) { grade = 3; gradeText = "3 (Удовл)"; }

        return {
          vocabPercent,
          grammarPercent,
          activityPercent,
          testPercent,
          testCorrect,
          totalTest,
          compositeScore,
          grade,
          gradeText
        };
      };

      const handleJoinClass = (e) => {
        e.preventDefault();
        if (!studentName.trim()) return alert("Пожалуйста, введите ваши Фамилию и Имя!");
        
        const id = 'std_' + Math.random().toString(36).substr(2, 9);
        setStudentId(id);
        setIsJoined(true);

        const initialMetrics = calculateMetrics(studentAnswers);
        const studentPayload = {
          id,
          name: studentName,
          group: groupName,
          ...initialMetrics,
          lastActive: new Date().toLocaleTimeString()
        };

        database.ref(`rooms/${roomPin}/students/${id}`).set(studentPayload);
      };

      const handleAnswer = (category, taskId, selectedOption) => {
        const updatedAnswers = {
          ...studentAnswers,
          [category]: {
            ...studentAnswers[category],
            [taskId]: selectedOption
          }
        };
        setStudentAnswers(updatedAnswers);

        const metrics = calculateMetrics(updatedAnswers);
        const studentPayload = {
          id: studentId,
          name: studentName,
          group: groupName,
          ...metrics,
          lastActive: new Date().toLocaleTimeString()
        };

        database.ref(`rooms/${roomPin}/students/${studentId}`).update(studentPayload);
      };

      const handleSubmitLesson = () => {
        setIsSubmitted(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Экспорт официальной ведомости
      const handleExportPDF = () => {
        const element = document.getElementById('official-gradebook-pdf');
        element.style.display = 'block';
        const opt = {
          margin: [10, 10, 10, 10],
          filename: `Ведомость_${groupName}_${disciplineName}_Урок1.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          element.style.display = 'none';
        });
      };

      // Скачивание материала урока студентом (PDF)
      const handleDownloadStudyPDF = () => {
        const element = document.getElementById('study-materials-content');
        const opt = {
          margin: [8, 8, 8, 8],
          filename: `Lesson_1_Study_Material.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      // Скачивание материала урока студентом (PNG)
      const handleDownloadStudyPNG = () => {
        const element = document.getElementById('study-materials-content');
        html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' }).then(canvas => {
          const link = document.createElement('a');
          link.download = `Lesson_1_Study_Material.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      };

      // QR генератор
      const qrStudyRef = useRef(null);
      const qrQuizRef = useRef(null);

      useEffect(() => {
        if (role === 'teacher') {
          const baseUrl = `${window.location.origin}${window.location.pathname}`;
          
          if (teacherTab === 'study' && qrStudyRef.current) {
            qrStudyRef.current.innerHTML = "";
            new QRCode(qrStudyRef.current, {
              text: `${baseUrl}?role=student&mode=study&room=${roomPin}&group=${encodeURIComponent(groupName)}`,
              width: 130,
              height: 130,
              colorDark: "#1E3A8A",
              colorLight: "#FFFFFF",
              correctLevel: QRCode.CorrectLevel.M
            });
          }

          if (teacherTab === 'quiz' && qrQuizRef.current) {
            qrQuizRef.current.innerHTML = "";
            new QRCode(qrQuizRef.current, {
              text: `${baseUrl}?role=student&mode=quiz&room=${roomPin}&group=${encodeURIComponent(groupName)}`,
              width: 130,
              height: 130,
              colorDark: "#10B981",
              colorLight: "#FFFFFF",
              correctLevel: QRCode.CorrectLevel.M
            });
          }
        }
      }, [role, teacherTab, roomPin, groupName]);

      // -------------------------------------------------------------
      // ВЫБОР РОЛИ (ГЛАВНЫЙ ЭКРАН)
      // -------------------------------------------------------------
      if (!role) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl text-white">
              <div className="w-16 h-16 bg-brand-600/20 text-brand-400 border border-brand-500/30 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl font-black">
                2026
              </div>
              <h1 className="text-2xl font-extrabold text-white mb-2">Business English Platform</h1>
              <p className="text-xs text-slate-400 mb-8">Интерактивный учебный комплекс и ведомость успеваемости</p>
              
              <div className="space-y-4">
                <button 
                  onClick={() => setRole('teacher')}
                  className="w-full py-4 px-6 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-3 text-sm">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  Режим Преподавателя (Интерактивная доска)
                </button>
                <button 
                  onClick={() => setRole('student')}
                  className="w-full py-4 px-6 bg-slate-700/80 hover:bg-slate-700 text-slate-200 font-bold rounded-2xl border border-slate-600 transition flex items-center justify-center gap-3 text-sm">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  Режим Студента (Смартфон)
                </button>
              </div>
            </div>
          </div>

                              <tr key={st.id} className="hover:bg-slate-700/30 transition">
                                <td className="py-3 px-3 font-mono text-slate-400">{idx + 1}</td>
                                <td className="py-3 px-3 font-bold text-white">{st.name}</td>
                                <td className="py-3 px-3 font-semibold text-brand-400">{st.vocabPercent}%</td>
                                <td className="py-3 px-3 font-semibold text-purple-400">{st.grammarPercent}%</td>
                                <td className="py-3 px-3 text-slate-300">{st.activityPercent}%</td>
                                <td className="py-3 px-3 font-bold text-emerald-400">{st.testCorrect} / 30</td>
                                <td className="py-3 px-3">
                                  <span className={`px-2.5 py-1 rounded-md font-bold text-[11px] ${
                                    st.grade === 5 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                                    st.grade === 4 ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' :
                                    st.grade === 3 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                    'bg-red-500/20 text-red-300 border border-red-500/30'
                                  }`}>
                                    {st.gradeText}
                                  </span>
                                </td>
                                <td className="py-3 px-3 text-right">
                                  <button
                                    onClick={() => handleDeleteStudent(st.id, st.name)}
                                    className="p-1 text-slate-400 hover:text-red-400 rounded transition"
                                  >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>

            {/* ШАБЛОН ДЛЯ ЭКСПОРТА В PDF */}
            <div style={{ display: 'none' }}>
              <div id="official-gradebook-pdf" style={{ padding: '20mm', backgroundColor: '#FFFFFF', color: '#000000', fontFamily: 'Arial, sans-serif', fontSize: '11pt' }}>
                <div style={{ textAlign: 'center', borderBottom: '2px solid #000', paddingBottom: '8px', marginBottom: '16px' }}>
                  <h2 style={{ margin: 0, fontSize: '14pt', fontWeight: 'bold' }}>ПРОГРЕСС УСПЕВАЕМОСТИ НА ПАРЕ</h2>
                  <p style={{ margin: '4px 0 0 0', fontSize: '10pt', color: '#444' }}>Дисциплина: {disciplineName}</p>
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px', fontSize: '10pt' }}>
                  <div><strong>Группа:</strong> {groupName}</div>
                  <div><strong>Форма контроля:</strong> {assessmentType}</div>
                  <div><strong>Дата:</strong> {lessonDate}</div>
                </div>

                <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '20px', fontSize: '9.5pt' }}>
                  <thead>
                    <tr style={{ backgroundColor: '#F0F0F0' }}>
                      <th style={{ border: '1px solid #000', padding: '6px', width: '30px', textAlign: 'center' }}>№</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'left' }}>ФИО Студента</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center' }}>Лексика (%)</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center' }}>Грамматика (%)</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center' }}>Активность (%)</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center' }}>Тест (%)</th>
                      <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center', width: '90px' }}>Оценка</th>
                    </tr>
                  </thead>
                  <tbody>
                    {studentsList.map((st, idx) => (
                      <tr key={st.id}>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>{idx + 1}</td>
                        <td style={{ border: '1px solid #000', padding: '5px' }}>{st.name}</td>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>{st.vocabPercent}%</td>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>{st.grammarPercent}%</td>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>{st.activityPercent}%</td>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>{st.testPercent}% ({st.testCorrect}/30)</td>
                        <td style={{ border: '1px solid #000', padding: '5px', textAlign: 'center', fontWeight: 'bold' }}>{st.gradeText}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div style={{ marginTop: '30px', display: 'flex', justifyContent: 'space-between', fontSize: '10pt' }}>
                  <div>
                    <p style={{ margin: '2px 0' }}>Всего студентов: <strong>{studentsList.length}</strong></p>
                    <p style={{ margin: '2px 0' }}>Шкала: 95-100% (5) | 66-94% (4) | 51-65% (3) | 1-50% (2)</p>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <p style={{ margin: '0 0 25px 0' }}>Преподаватель: ____________________ / {teacherFullName}</p>
                  </div>
                </div>
              </div>
            </div>

          </div>
        );
      }

      // -------------------------------------------------------------
      // 3. РЕЖИМ СТУДЕНТА (НА ТЕЛЕФОНЕ)
      // -------------------------------------------------------------
      if (role === 'student') {
        
        // Вход студента
        if (!isJoined) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
              <div className="max-w-sm w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 text-center">
                <span className="text-[10px] font-bold uppercase tracking-wider text-brand-600 bg-brand-50 px-3 py-1 rounded-full">
                  {studentTab === 'study' ? 'Режим чтения конспекта' : 'Режим тестирования'}
                </span>
                <h2 className="text-lg font-black text-slate-900 mt-3 mb-1">Урок 1: The Job Search</h2>
                <p className="text-xs text-slate-500 mb-6">Группа: <strong>{groupName}</strong></p>

                <form onSubmit={handleJoinClass} className="space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Введите ваше ФИО</label>
                    <input 
                      type="text" 
                      required
                      placeholder="напр. Смирнова Анна"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm outline-none font-semibold"
                    />
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition text-sm">
                    Войти на занятие
                  </button>
                </form>
              </div>
            </div>
          );
        }

        const metrics = calculateMetrics(studentAnswers);

        // Экран финальной оценки
        if (isSubmitted) {
          return (
            <div className="min-h-screen bg-slate-900 text-white p-6 flex flex-col items-center justify-center text-center">
              <div className="w-20 h-20 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full flex items-center justify-center text-3xl mb-4 animate-bounce">
                ✓
              </div>
              <h1 className="text-xl font-black">{studentName}</h1>
              <p className="text-xs text-slate-400 mb-6">Группа {groupName} • {LESSON_1_DATA.title}</p>

              <div className="w-full max-w-xs bg-slate-800 border border-slate-700 rounded-3xl p-6 mb-6 shadow-2xl">
                <div className="text-xs font-bold text-slate-400 uppercase mb-1">Ваша итоговая оценка</div>
                <div className="text-6xl font-black text-emerald-400 my-2">{metrics.grade}</div>
                <div className="text-sm font-semibold text-slate-300">{metrics.gradeText} ({metrics.compositeScore}%)</div>
              </div>

              <div className="w-full max-w-xs grid grid-cols-2 gap-3 text-left mb-6 text-xs">
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div className="text-slate-400 font-bold">Лексика:</div>
                  <div className="text-base font-bold text-white">{metrics.vocabPercent}%</div>
                </div>
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div className="text-slate-400 font-bold">Грамматика:</div>
                  <div className="text-base font-bold text-white">{metrics.grammarPercent}%</div>
                </div>
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div className="text-slate-400 font-bold">Активность:</div>
                  <div className="text-base font-bold text-white">{metrics.activityPercent}%</div>
                </div>
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div className="text-slate-400 font-bold">Тест (из 30):</div>
                  <div className="text-base font-bold text-emerald-400">{metrics.testCorrect}/30 ({metrics.testPercent}%)</div>
                </div>
              </div>

              <p className="text-[11px] text-slate-500">Результат сохранен в ведомости преподавателя.</p>
            </div>
          );
        }

        // Страница студента с переключателем (Чтение конспекта ИЛИ Тест)
        return (
          <div className="min-h-screen bg-slate-50 pb-20">
            
            <header className="sticky top-0 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 z-30 flex items-center justify-between shadow-sm">
              <div>
                <div className="text-[10px] font-bold uppercase tracking-wider text-brand-600">{groupName} • {studentName}</div>
                <div className="text-xs font-extrabold text-slate-900">Урок 1: The Job Search</div>
              </div>
              <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  onClick={() => setStudentTab('study')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold ${studentTab === 'study' ? 'bg-white shadow text-brand-600' : 'text-slate-600'}`}
                >
                  Конспект
                </button>
                <button
                  onClick={() => setStudentTab('quiz')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold ${studentTab === 'quiz' ? 'bg-emerald-600 shadow text-white' : 'text-slate-600'}`}
                >
                  Тест
                </button>
              </div>
            </header>

            <main className="max-w-md mx-auto p-4 space-y-6">
              
              {/* ВКЛАДКА 1: ЧТЕНИЕ КОНСПЕКТА + СКАЧИВАНИЕ В САМОМ КОНЦЕ */}
              {studentTab === 'study' && (
                <div className="space-y-6">
                  <StudyMaterialView />
                  
                  {/* Кнопки скачивания в конце страницы */}
                  <div className="bg-slate-900 text-white p-5 rounded-3xl text-center space-y-3 shadow-lg">
                    <div className="text-xs font-bold uppercase tracking-wider text-brand-400">Сохранить для подготовки к тесту</div>
                    <p className="text-xs text-slate-300">Скачайте конспект урока на телефон, чтобы сверяться с ним во время тестирования:</p>
                    <div className="grid grid-cols-2 gap-3 pt-2">
                      <button
                        onClick={handleDownloadStudyPDF}
                        className="py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition"
                      >
                        Скачать PDF
                      </button>
                      <button
                        onClick={handleDownloadStudyPNG}
                        className="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold border border-slate-700 flex items-center justify-center gap-2 transition"
                      >
                        Скачать PNG
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ВКЛАДКА 2: ИНТЕРАКТИВНЫЙ ТЕСТ */}
              {studentTab === 'quiz' && (
                <div className="space-y-6">
                  
                  {/* Лексика */}
                  <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <span className="w-5 h-5 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center text-xs">1</span>
                      Лексический практикум
                    </h3>
                    <div className="space-y-4">
                      {LESSON_1_DATA.vocabTasks.map((t, idx) => (
                        <div key={t.id} className="text-xs">
                          <p className="font-semibold text-slate-800 mb-2">{idx + 1}. {t.q}</p>
                          <div className="grid grid-cols-3 gap-2">
                            {t.options.map(opt => (
                              <button
                                key={opt}
                                onClick={() => handleAnswer('vocab', t.id, opt)}
                                className={`py-2 px-1 rounded-lg font-bold border text-center transition ${
                                  studentAnswers.vocab[t.id] === opt 
                                    ? 'bg-brand-600 text-white border-brand-600 shadow-sm' 
                                    : 'bg-slate-50 text-slate-700 border-slate-200'
                                }`}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* Грамматика */}
                  <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <span className="w-5 h-5 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-xs">2</span>
                      Грамматика &amp; Action Verbs
                    </h3>
                    <div className="space-y-4">
                      {LESSON_1_DATA.grammarTasks.map((t, idx) => (
                        <div key={t.id} className="text-xs">
                          <p className="font-semibold text-slate-800 mb-2">{idx + 1}. {t.q}</p>
                          <div className="grid grid-cols-2 gap-2">
                            {t.options.map(opt => (
                              <button
                                key={opt}
                                onClick={() => handleAnswer('grammar', t.id, opt)}
                                className={`py-2 px-1 rounded-lg font-bold border text-center transition ${
                                  studentAnswers.grammar[t.id] === opt 
                                    ? 'bg-purple-600 text-white border-purple-600 shadow-sm' 
                                    : 'bg-slate-50 text-slate-700 border-slate-200'
                                }`}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* Тест 30 вопросов */}
                  <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <span className="w-5 h-5 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xs">3</span>
                      Итоговый тест (30 вопросов)
                    </h3>
                    <div className="space-y-4">
                      {LESSON_1_DATA.testQuestions.map(t => (
                        <div key={t.id} className="text-xs border-b border-slate-100 pb-3">
                          <p className="font-semibold text-slate-800 mb-2">{t.q}</p>
                          <div className="grid grid-cols-3 gap-2">
                            {t.options.map(opt => (
                              <button
                                key={opt}
                                onClick={() => handleAnswer('test', t.id, opt)}
                                className={`py-2 px-1 rounded-lg font-bold border text-center transition ${
                                  studentAnswers.test[t.id] === opt 
                                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                                    : 'bg-slate-50 text-slate-700 border-slate-200'
                                }`}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  <button
                    onClick={handleSubmitLesson}
                    className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-600/30 text-xs sm:text-sm uppercase tracking-wider transition"
                  >
                    Завершить урок и получить оценку
                  </button>

                </div>
              )}

            </main>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
